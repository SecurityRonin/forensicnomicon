[package]
name = "forensicnomicon-data"
# Pre-1.0 while the split is in progress. This is the fast-moving knowledge layer;
# it releases frequently and independently of the stable `forensicnomicon-core`.
version = "0.1.1"
description = "Detection knowledge for the ForensicNomicon: the artifact descriptor catalog (the global CATALOG) and evidence/volatility lookups. The fast-moving data layer atop forensicnomicon-core."
edition.workspace = true
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/forensicnomicon"
homepage = "https://github.com/SecurityRonin/forensicnomicon"
documentation = "https://docs.rs/forensicnomicon-data"
keywords = ["forensics", "dfir", "incident-response", "mitre", "artifacts"]
categories = ["science", "data-structures"]

[features]
default = ["std"]
std = ["forensicnomicon-core/std"]
serde = ["dep:serde", "forensicnomicon-core/serde"]

[dependencies]
forensicnomicon-core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
