[package]
name = "ingest"
version = "0.1.0"
edition.workspace = true
rust-version = "1.75"
description = "Mass-import ingestion pipeline for the forensicnomicon artifact catalog"
license = "Apache-2.0"
publish = false

[[bin]]
name = "ingest"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
regex = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
