[package]
name = "forensicnomicon-core"
# Stable 1.0 engine layer: the report model + lookup engine + structural constants
# are the semver-stable surface the fleet's analyzer crates pin against
# (forensicnomicon-core = "1"). Bump majors deliberately — see
# docs/plans/2026-06-28-knowledge-propagation-and-crate-split.md.
version = "1.1.0"
description = "Stable engine layer of the ForensicNomicon: the normalized DFIR report model (Finding/Severity/Observation) and structural format constants. Zero deps."
edition.workspace = true
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/forensicnomicon"
homepage = "https://github.com/SecurityRonin/forensicnomicon"
documentation = "https://docs.rs/forensicnomicon-core"
keywords = ["forensics", "dfir", "incident-response", "report", "filesystem"]
categories = ["science", "data-structures"]

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
