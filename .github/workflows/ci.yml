name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@0e677831e286bec0fce2613f9958f6af72ed4a2c
    with:
      # MSRV is NOT overridden. Every member declares a floor and the shared
      # workflow verifies each at its own. That is a real widening: the job this
      # replaces ran `cargo test` at 1.75 against the ROOT package only, so the
      # two binary crates were never checked -- and both declared 1.75 while
      # depending on hashbrown 0.17, which needs edition2024 (cargo 1.85+).
      # Both now declare the pinned toolchain, which is what they can keep.
      msrv-check: test
      # Coverage is a FLOOR and the number is measured: LINE coverage is 96.59%
      # with binaries excluded, read from `cargo llvm-cov --json` rather than the
      # summary table, whose first percentage column is regions. There was no
      # coverage gate here before.
      coverage-gate: floor
      coverage-floor: 96
      coverage-ignore-regex: '(^|/)src/(main\.rs|bin/)'
