# Extracted from ci.yml during the migration to the shared fleet workflow.
#
# This is an ARTIFACT PRODUCER, not a gate: it runs an example and uploads the
# result for download. It asserts nothing and can fail only if the example
# breaks, which the test job already covers. Keeping it out of `ci.yml` makes
# that explicit rather than leaving a job beside the shared-workflow call where
# a reader might mistake it for part of the gate.
name: snapshot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    name: Snapshot — dump_lol
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          cache-on-failure: true
      - run: cargo run --example dump_lol --features serde
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forensicnomicon-snapshots
          path: data/
          retention-days: 90
