[workspace]
members = [".", "crates/core", "crates/data", "crates/ingest", "crates/4n6query"]

# Shared package field (DRY): every member is edition 2021; set it once here and
# members inherit via `edition.workspace = true`. version / rust-version /
# license differ across members, so they stay inline.
[workspace.package]
edition = "2021"

# Single source of truth for dependency versions shared by 2+ members (DRY).
# `forensicnomicon` is the root crate itself, declared as a path dep so the
# in-workspace members link the local copy; the version pins it for publish.
[workspace.dependencies]
forensicnomicon = { path = ".", version = "1.3" }
forensicnomicon-core = { path = "crates/core", version = "1.0" }
forensicnomicon-data = { path = "crates/data", version = "1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Paranoid Gatekeeper (fleet standard). forensicnomicon is the zero-dep KNOWLEDGE
# leaf — compile-time artifact specs and constant tables, no I/O or binary
# deserialization — so `unsafe_code` is forbidden outright. The panic-free denies
# (unwrap_used / expect_used) still apply: a published accessor must never panic.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Panic-free production code: no unwrap/expect outside tests.
unwrap_used = { level = "deny", priority = 0 }
expect_used = { level = "deny", priority = 0 }
# Pragmatic allows — stylistic pedantic lints that fight the domain (large
# generated constant tables, scheme-prefixed codes, deliberate numeric casts).
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
unreadable_literal = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
# Domain noise for a generated DFIR catalog + codegen tooling: the catalog/
# dispatch functions are intentionally large; codegen builders declare items
# mid-scope; artifact-path extension matches are intentionally case-exact.
too_many_lines = { level = "allow", priority = 1 }
items_after_statements = { level = "allow", priority = 1 }
case_sensitive_file_extension_comparisons = { level = "allow", priority = 1 }

[package]
name = "forensicnomicon"
version = "1.3.0"
description = "The ForensicNomicon — comprehensive DFIR artifact catalog: UserAssist, Shimcache, Amcache, Prefetch, $MFT, ShellBags, EVTX, NTDS.dit, SAM, SRUM, LNK, Jump Lists + KAPE/Velociraptor/Sigma/MITRE. Zero deps."
edition.workspace = true
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/forensicnomicon"
homepage = "https://github.com/SecurityRonin/forensicnomicon"
documentation = "https://docs.rs/forensicnomicon"
keywords = ["forensics", "dfir", "incident-response", "mitre", "artifacts"]
categories = ["science", "data-structures"]
readme = "README.md"
# The published crate is the catalog library only. Exclude the daily feed-watch
# archive (archive/sources/pending-review.jsonl grows to multiple MB and timed
# out the crates.io upload), the Python tooling, fixtures, and fuzz targets.
exclude = [
    "archive/",
    "scripts/",
    "tests/",
    "fuzz/",
]

[features]
default = ["std"]
std = ["forensicnomicon-core/std", "forensicnomicon-data/std"]
serde = ["dep:serde", "forensicnomicon-core/serde", "forensicnomicon-data/serde"]

[dependencies]
forensicnomicon-core = { workspace = true }
forensicnomicon-data = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
# TEST-ONLY: parses the real DC01 SYSTEM hive in tests/services_dc01_isolation.rs
# to prove the known-good service catalog isolates the coreupdater.exe masquerade
# on genuine data. winreg-core does NOT depend on forensicnomicon (no dep cycle);
# this never enters the published dependency graph (dev-dep only). Sourced from
# the registry (not a sibling path) so CI and fresh clones resolve it.
winreg-core = "0.1.1"

[lints]
workspace = true

[[example]]
name = "dump_lol"
required-features = ["serde"]
